databases:
  - name: travel-expense-db
    plan: free
    databaseName: travel_expense
    user: travel_expense

services:
  - type: web
    name: travel-expense-tracker
    runtime: node
    plan: free
    # --include=dev: NODE_ENV=production (set below) makes plain `npm install` skip
    # devDependencies, but the client build needs vite/typescript/@types/node to run tsc/vite.
    # prisma:generate is run explicitly because Render's npm install doesn't run the
    # @prisma/client postinstall script that would normally generate it automatically.
    buildCommand: npm install --include=dev && npm run prisma:generate -w server && npm run build
    startCommand: npm run start -w server
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 30d
      - key: DATABASE_URL
        fromDatabase:
          name: travel-expense-db
          property: connectionString
